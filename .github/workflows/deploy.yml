name: 🚀 Deploy PostulacionBot VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🛡️ Validar sentencias estructurales en PHP
      run: |
        BEFORE="${{ github.event.before }}"
        if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then BEFORE="HEAD~1"; fi
        CHANGED_FILES=$(git diff --name-only $BEFORE ${{ github.sha }} | grep '\.php$' || true)
        if [ -n "$CHANGED_FILES" ]; then
          for file in $CHANGED_FILES; do
            if [ -f "$file" ]; then
              if grep -iwe -E "(create|drop|alter|rename|truncate)\s+table" "$file"; then
                echo "❌ ERROR: Se detectó una sentencia estructural en $file. No se subirá al host."
                exit 1
              fi
            fi
          done
          echo "✅ Los archivos PHP modificados están limpios."
        else
          echo "✅ No hay archivos PHP modificados."
        fi
      
    - name: 🔑 Ejecutar comandos en VPS vía SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          cd /root/postulacion-bot
          echo "📥 Actualizando código desde GitHub..."
          git pull origin main
          
          # Cargar entorno e instalar dependencias actualizadas
          if [ -d "venv" ]; then
            echo "📦 Actualizando dependencias en el venv..."
            source venv/bin/activate
            pip install -r requirements.txt
            echo "🌐 Instalando navegadores de Playwright (chromium + firefox)..."
            venv/bin/python3 -m playwright install chromium firefox
          fi
          
          # Asegurar que Tor esté instalado y corriendo (proxy para Cloudflare bypass)
          if ! command -v tor &> /dev/null; then
            echo "🧅 Instalando Tor..."
            apt-get install -y tor
          fi
          systemctl enable tor
          systemctl start tor || true
          
          echo "🔄 Reiniciando servicio PM2..."
          pm2 restart postulacion-bot || pm2 start ecosystem.config.js
          
          echo "✅ Despliegue con éxito."
